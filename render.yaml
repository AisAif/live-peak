services:
  - type: web
    name: live-peak
    env: python
    region: virginia
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./live_peak.db
      - key: Z_SCORE_THRESHOLD
        value: "2.5"
      - key: WINDOW_DURATION_SECONDS
        value: "10"
